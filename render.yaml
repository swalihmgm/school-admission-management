services:
  - type: web
    name: school-admission-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: PAYMENT_SIMULATOR_ENABLED
        value: "true"
      - key: ACCESS_TOKEN_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: ADMIN_FULL_NAME
        value: Admission Team Admin
      - key: ADMIN_EMAIL
        value: admin@school.com
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        value: rzp_test_dummy_key_id
      - key: RAZORPAY_KEY_SECRET
        value: rzp_test_dummy_key_secret
      - key: RAZORPAY_WEBHOOK_SECRET
        value: rzp_test_dummy_webhook_secret
      - key: ADMIN_PASSWORD
        sync: false
